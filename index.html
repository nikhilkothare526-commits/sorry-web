<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Just For You ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff416c, #ff4b8b, #7b2ff7);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* Floating Hearts */

        .heart {
            position: fixed;
            bottom: -30px;
            font-size: 20px;
            animation: float 7s linear infinite;
            opacity: 0.7;
            pointer-events: none;
        }

        @keyframes float {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }

        }

        /* Main Card */

        .card {
            width: 90%;
            max-width: 450px;
            padding: 35px 25px;
            text-align: center;

            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;

            box-shadow: 0 20px 50px rgba(0,0,0,0.25);

            animation: appear 1.2s ease;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        .main-heart {
            font-size: 55px;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {

            50% {
                transform: scale(1.18);
            }

        }

        h1 {
            margin-top: 10px;
            font-size: 32px;
        }

        .subtitle {
            margin-top: 8px;
            opacity: 0.9;
            font-size: 14px;
        }

        /* Message */

        #message {
            min-height: 120px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px 5px;

            font-size: 21px;
            font-weight: bold;
            line-height: 1.5;
        }

        #counter {
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        /* Button */

        button {
            border: none;
            padding: 13px 25px;
            border-radius: 30px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            background: white;
            color: #ff416c;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
        }

        .final {
            display: none;
        }

        .final h2 {
            font-size: 26px;
            margin: 20px 0;
        }

        .yes {
            background: #ff1744;
            color: white;
            margin: 5px;
        }

        .angry {
            margin: 5px;
        }

        #reply {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.75;
        }

    </style>

</head>


<body>


    <!-- Floating Hearts -->

    <script>

        function createHeart() {

            const heart = document.createElement("div");

            heart.className = "heart";

            heart.innerHTML = ["❤️","💕","💗","💖","💘"][Math.floor(Math.random() * 5)];

            heart.style.left = Math.random() * 100 + "vw";

            heart.style.animationDuration =
                (5 + Math.random() * 5) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 10000);
        }

        setInterval(createHeart, 700);

    </script>


    <!-- Main Card -->

    <div class="card">

        <div class="main-heart">❤️</div>

        <h1>I'm Sorry</h1>

        <p class="subtitle">
            This isn't just another "sorry"...
        </p>


        <div id="main">

            <div id="message">
                I have something to say... 🥺
            </div>

            <div id="counter">
                Ready?
            </div>

            <button onclick="startSorry()">
                Open My Heart ❤️
            </button>

        </div>


        <!-- Final Screen -->

        <div class="final" id="final">

            <h2>
                Will you forgive me? 🥺❤️
            </h2>

            <button class="yes" onclick="forgive()">
                Yes ❤️
            </button>

            <button class="angry" onclick="stillAngry()">
                Still angry 😤
            </button>

            <div id="reply"></div>

        </div>


        <div class="footer">
            Made with a little courage and a lot of sincerity ❤️
        </div>

    </div>


    <script>

        const messages = [

            "I'm sorry... genuinely, from my heart. ❤️",

            "Mujhse galti ho gayi. Please dil se maaf kar dena. 🥺",

            "I never wanted to be the reason behind your bad mood.",

            "Sorry... because seeing you upset doesn't feel right to me. ❤️",

            "No excuses this time. I was wrong, and I'm truly sorry.",

            "Agar ek 'sorry' tumhari smile wapas la sakta hai, toh ye dil se hai. ❤️",

            "I wish I could go back and change that moment.",

            "Tum naraz ho toh sab kuch thoda incomplete sa lagta hai. 🥺",

            "I'm sorry for the words I shouldn't have said.",

            "You deserved better from me at that moment. I'm sorry.",

            "Error 404: Good decision not found. 😭",

            "Bug detected in my behavior... fixing it with a sincere apology. ❤️",

            "Sorry.exe has been running since I realized my mistake. 😂❤️",

            "If I could press Ctrl+Z on that moment, I definitely would.",

            "One mistake shouldn't erase all the good moments between us. ❤️",

            "I'm not asking you to forget it, just giving you a heartfelt sorry.",

            "Please keep the smile... I'll keep the lesson. 😊",

            "I may not be perfect, but my apology is completely genuine.",

            "Last but not least... I'm really, really sorry. ❤️",

            "And if you're still reading this... thank you. Now please smile once? 🥺❤️"

        ];


        let index = -1;


        function startSorry() {

            index++;

            if (index < messages.length) {

                document.getElementById("message").innerText =
                    messages[index];

                document.getElementById("counter").innerText =
                    (index + 1) + " / 20";

                document.querySelector("#main button").innerText =
                    index === 19
                    ? "One Last Thing ❤️"
                    : "Another Sorry ❤️";

            }

            else {

                document.getElementById("main").style.display =
                    "none";

                document.getElementById("final").style.display =
                    "block";

            }

        }


        function forgive() {

            document.getElementById("reply").innerHTML =
                "Yesss! ❤️🥹<br><br>Thank you for forgiving me. Now please smile 😊";

        }


        function stillAngry() {

            document.getElementById("reply").innerHTML =
                "Okay... I'll wait. 🥺❤️<br><br>But I'm still genuinely sorry.";

        }

    </script>
    <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<button onclick="playMusic()">🎵 Play Music</button>

<script>
function playMusic() {
    document.getElementById("bgMusic").play();
}
</script>


</body>

</html>
